<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 310" fill="none">
  <defs>
    <radialGradient id="bookAura" cx="0.52" cy="0.48" r="0.48">
      <stop offset="0%" stop-color="#f4b942" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#f4b942" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f4b942" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="keyholeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff4cc" stop-opacity="0.98"/>
      <stop offset="45%" stop-color="#f4b942" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#f4b942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leatherFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5e42"/>
      <stop offset="55%" stop-color="#714931"/>
      <stop offset="100%" stop-color="#533422"/>
    </linearGradient>
    <linearGradient id="leatherSpine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#482c1d"/>
      <stop offset="60%" stop-color="#613e2a"/>
      <stop offset="100%" stop-color="#3f2618"/>
    </linearGradient>
    <linearGradient id="pageEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8c39d"/>
      <stop offset="65%" stop-color="#f5ebd6"/>
      <stop offset="100%" stop-color="#cbb187"/>
    </linearGradient>
  </defs>

  <!-- Ambient Halo & Floating Shadow -->
  <circle cx="132" cy="148" r="118" fill="url(#bookAura)"/>
  <ellipse cx="132" cy="288" rx="88" ry="13" fill="#0d0907" fill-opacity="0.46"/>

  <!-- Back Leather Board (3D depth) -->
  <rect x="52" y="34" width="166" height="232" rx="15" fill="#462b1c" stroke="#2a1e17" stroke-width="4.5"/>

  <!-- Thick Aged Parchment Page Block -->
  <path d="M52 28 H198 C206 28 212 34 212 42 V246 C212 254 206 260 198 260 H52 Z" fill="url(#pageEdge)" stroke="#2a1e17" stroke-width="4"/>
  <!-- Fine Page Layers -->
  <line x1="196" y1="36" x2="196" y2="252" stroke="#b99c72" stroke-width="1.6"/>
  <line x1="201" y1="38" x2="201" y2="250" stroke="#b99c72" stroke-width="1.4"/>
  <line x1="206" y1="40" x2="206" y2="248" stroke="#b99c72" stroke-width="1.2"/>

  <!-- Silk Ribbon Bookmark -->
  <path d="M148 252 V284 L160 274 L172 284 V252 Z" fill="#b85a4a" stroke="#2a1e17" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- Front Leather Cover -->
  <rect x="38" y="20" width="162" height="232" rx="13" fill="url(#leatherFront)" stroke="#2a1e17" stroke-width="4.5"/>

  <!-- Rounded Spine & Raised Ribs -->
  <rect x="38" y="20" width="28" height="232" rx="10" fill="url(#leatherSpine)" stroke="#2a1e17" stroke-width="4"/>
  <g stroke="#2a1e17" stroke-width="2.6" fill="#7a5239">
    <rect x="36" y="54" width="32" height="10" rx="4"/>
    <rect x="36" y="131" width="32" height="10" rx="4"/>
    <rect x="36" y="208" width="32" height="10" rx="4"/>
  </g>

  <!-- Gilded Corner Clasps & Inner Filigree Border -->
  <path d="M170 24 H194 V48" stroke="#f4b942" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 248 H194 V224" stroke="#f4b942" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="76" y="36" width="110" height="200" rx="8" fill="none" stroke="#f4b942" stroke-width="2.4" opacity="0.72"/>
  <rect x="82" y="42" width="98" height="188" rx="5" fill="none" stroke="#f4b942" stroke-width="1.2" opacity="0.38"/>

  <!-- Soft Keyhole Warm Glow Spill -->
  <circle cx="131" cy="136" r="56" fill="url(#keyholeGlow)"/>

  <!-- Brass Escutcheon & Illuminated Keyhole -->
  <circle cx="131" cy="136" r="32" fill="#2c1e16" stroke="#f4b942" stroke-width="3.8"/>
  <circle cx="131" cy="136" r="24" fill="#3a281d" stroke="#d59a28" stroke-width="1.5" opacity="0.8"/>
  <circle cx="131" cy="127" r="9" fill="#ffe699"/>
  <path d="M125 131 H137 L140 154 H122 Z" fill="#ffe699"/>
</svg>
